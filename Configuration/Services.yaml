services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\WebconEasyWorkspace\:
    resource: '../Classes/*'

  # AJAX endpoints invoked from the toolbar dropdown glue script.
  Webconsulting\WebconEasyWorkspace\Controller\Backend\EasyWorkspaceAjaxController:
    public: true

  Webconsulting\WebconEasyWorkspace\Controller\Backend\EasyWorkspaceModuleController:
    public: true

  # Retrieved from the container in functional tests.
  Webconsulting\WebconEasyWorkspace\Service\PublishSelectedService:
    public: true

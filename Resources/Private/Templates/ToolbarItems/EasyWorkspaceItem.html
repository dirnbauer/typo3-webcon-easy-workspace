<html xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<span class="toolbar-item-icon" title="Workspace publish">
    <core:icon identifier="actions-workspace" alternativeMarkupIdentifier="inline"/>
    <!--
        Count badge mounted by the Lit dropdown element. It's hidden
        until the dropdown loads and reports a changed-count > 0.
        Kept in the toolbar trigger (not the dropdown body) so the
        editor sees the count without having to open the dropdown.
    -->
    <span class="wew-toolbar-badge" hidden aria-hidden="true"></span>
</span>
<span class="toolbar-item-title">Workspace publish</span>

</html>

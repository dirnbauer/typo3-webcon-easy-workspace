<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="wew-backend-module">
    <f:if condition="{flashMessages}">
        <div class="wew-backend-module__messages">
            <f:for each="{flashMessages}" as="flashMessage">
                <f:render partial="Backend/Module/FlashMessage" arguments="{flashMessage: flashMessage}" />
            </f:for>
        </div>
    </f:if>

    <f:if condition="{canRenderEasyWorkspace}">
        <f:then>
            <div class="wew-app"
                 data-wew-module=""
                 data-wew-preview-url="{previewLinkUrl}"
                 data-wew-diff-url="{diffUrl}"
                 data-wew-labels="{jsLabelsJson -> f:format.htmlspecialchars()}">
                <f:render partial="Backend/Module/Nav" arguments="{sections: sections, pageUid: pageUid, newsUid: newsUid, formAction: formAction, data: data, hasContext: hasContext, config: config, section: section}" />
                <main class="wew-app__main">
                    <f:if condition="{hasContext}">
                        <f:then>
                            <f:render partial="Backend/Module/Section/{section -> f:format.case(mode: 'capital')}" arguments="{_all}" />
                        </f:then>
                        <f:else>
                            <f:render partial="Backend/Module/Placeholder" arguments="{
                                tone: 'info',
                                iconIdentifier: 'apps-pagetree-page-default',
                                title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.noContext\')}'
                            }" />
                        </f:else>
                    </f:if>
                </main>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info wew-backend-module__callout" role="status">
                <div class="callout-content">
                    <div class="callout-title">{moduleTitle}</div>
                    <div class="callout-body">{disabledMessage}</div>
                </div>
            </div>
        </f:else>
    </f:if>
</div>

</html>

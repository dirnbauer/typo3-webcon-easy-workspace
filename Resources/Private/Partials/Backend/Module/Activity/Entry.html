<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<li class="list-group-item">
    <div class="d-flex align-items-start justify-content-between gap-2">
        <div class="min-w-0">
            <f:if condition="{entry.editUrl}">
                <f:then>
                    <a class="fw-semibold text-truncate d-block" href="{entry.editUrl}" title="{entry.title}">
                        <f:if condition="{entry.title}">
                            <f:then>{entry.title}</f:then>
                            <f:else><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.noTitle" /></f:else>
                        </f:if>
                    </a>
                </f:then>
                <f:else>
                    <span class="fw-semibold text-truncate d-block" title="{entry.title}">
                        <f:if condition="{entry.title}">
                            <f:then>{entry.title}</f:then>
                            <f:else><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.noTitle" /></f:else>
                        </f:if>
                    </span>
                </f:else>
            </f:if>
            <span class="text-muted small">{entry.tableLabel} · #{entry.workspaceUid}</span>
        </div>
        <div class="d-flex flex-wrap justify-content-end gap-1">
            <f:for each="{entry.changeBadges}" as="badge">
                <span class="badge badge-{badge.badge}">{badge.kindLabel}</span>
            </f:for>
        </div>
    </div>

    <f:if condition="{entry.diff -> f:count()} > 0">
        <f:then>
            <dl class="mt-2 mb-0">
                <f:for each="{entry.diff}" as="diffEntry">
                    <f:variable name="diffKind" value="{diffEntry.kind}" />
                    <f:if condition="{diffKind} == ''"><f:variable name="diffKind" value="changed" /></f:if>
                    <div class="row g-2 border-top pt-2">
                        <dt class="col-sm-3 text-muted small">{diffEntry.label}</dt>
                        <dd class="col-sm-9 mb-0">
                            <f:switch expression="{diffKind}">
                                <f:case value="added">
                                    <span class="badge badge-success">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.added" />
                                    </span>
                                    <span class="text-truncate d-inline-block mw-100 align-bottom" title="{diffEntry.afterFull}">
                                        <f:if condition="{diffEntry.after}">
                                            <f:then>{diffEntry.after}</f:then>
                                            <f:else>
                                                <em class="text-muted">
                                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.empty" />
                                                </em>
                                            </f:else>
                                        </f:if>
                                    </span>
                                </f:case>
                                <f:case value="removed">
                                    <span class="badge badge-danger">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.removed" />
                                    </span>
                                    <span class="text-truncate d-inline-block mw-100 align-bottom" title="{diffEntry.beforeFull}">
                                        <f:if condition="{diffEntry.before}">
                                            <f:then>{diffEntry.before}</f:then>
                                            <f:else>
                                                <em class="text-muted">
                                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.empty" />
                                                </em>
                                            </f:else>
                                        </f:if>
                                    </span>
                                </f:case>
                                <f:defaultCase>
                                    <span class="text-truncate d-inline-block mw-100 align-bottom" title="{diffEntry.beforeFull}">
                                        <f:if condition="{diffEntry.before}">
                                            <f:then>{diffEntry.before}</f:then>
                                            <f:else>
                                                <em class="text-muted">
                                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.empty" />
                                                </em>
                                            </f:else>
                                        </f:if>
                                    </span>
                                    <span class="text-muted" aria-hidden="true">-&gt;</span>
                                    <span class="text-truncate d-inline-block mw-100 align-bottom" title="{diffEntry.afterFull}">
                                        <f:if condition="{diffEntry.after}">
                                            <f:then>{diffEntry.after}</f:then>
                                            <f:else>
                                                <em class="text-muted">
                                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.diff.empty" />
                                                </em>
                                            </f:else>
                                        </f:if>
                                    </span>
                                </f:defaultCase>
                            </f:switch>
                        </dd>
                    </div>
                </f:for>
            </dl>
        </f:then>
        <f:else>
            <p class="text-muted small mb-0 mt-2">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.noDiff" />
            </p>
        </f:else>
    </f:if>
</li>

</html>

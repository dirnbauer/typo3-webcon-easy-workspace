<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<article class="wew-stat wew-stat--{tone}">
    <span class="wew-stat__value">{value}</span>
    <span class="wew-stat__label">{label}</span>
    <f:if condition="{hint}">
        <span class="wew-stat__hint">{hint}</span>
    </f:if>
</article>

</html>

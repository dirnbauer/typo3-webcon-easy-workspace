<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<aside class="wew-app__nav" aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.nav.aria')}">
    <header class="wew-app__nav-head">
        <span class="wew-app__nav-icon" aria-hidden="true">
            <core:icon identifier="module-workspaces" size="medium" />
        </span>
        <div class="wew-app__nav-heading">
            <span class="wew-app__nav-eyebrow">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.nav.eyebrow" />
            </span>
            <span class="wew-app__nav-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.title" />
            </span>
            <f:if condition="{data.workspaceTitle}">
                <span class="wew-menu__ws-chip"
                      title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.activeWorkspace')}">
                    {data.workspaceTitle}
                </span>
            </f:if>
        </div>
    </header>

    <nav class="wew-app__nav-list-wrap">
        <ul class="wew-app__nav-list" role="list">
            <f:for each="{sections}" as="navItem">
                <li class="wew-app__nav-item">
                    <a href="{navItem.url}"
                       class="wew-app__nav-link{f:if(condition: navItem.current, then: ' wew-app__nav-link--active')}"
                       aria-current="{f:if(condition: navItem.current, then: 'page', else: 'false')}">
                        <span class="wew-app__nav-link-icon" aria-hidden="true">
                            <core:icon identifier="{navItem.iconIdentifier}" size="small" />
                        </span>
                        <span class="wew-app__nav-link-label">{navItem.label}</span>
                        <f:if condition="{navItem.badge} > 0">
                            <span class="wew-app__nav-link-badge wew-app__nav-link-badge--{navItem.badgeTone}">{navItem.badge}</span>
                        </f:if>
                    </a>
                </li>
            </f:for>
        </ul>
    </nav>

    <f:if condition="{config.enablePreviewLink} && {pageUid} > 0">
        <footer class="wew-app__nav-foot">
            <button type="button"
                    class="btn btn-default wew-menu__preview"
                    data-wew-preview-trigger=""
                    data-wew-preview-page-uid="{pageUid}"
                    title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:preview.button.title')}">
                <core:icon identifier="actions-link" size="small" />
                <span class="wew-menu__preview-label">
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:preview.button.preview" />
                </span>
            </button>
        </footer>
    </f:if>
</aside>

</html>

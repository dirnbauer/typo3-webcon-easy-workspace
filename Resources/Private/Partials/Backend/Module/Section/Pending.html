<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section aria-labelledby="wew-section-pending-title">
    <h2 class="visually-hidden" id="wew-section-pending-title">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.pending" />
    </h2>
    <div class="card-container wew-kpi-grid">
        <div class="card wew-kpi-card">
            <div class="card-header">
                <div class="card-header-body">
                    <div class="fs-1 fw-bold lh-1 mb-2 wew-kpi-value">{data.changedCount}</div>
                    <h3 class="card-title">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.openChanges" />
                    </h3>
                    <p class="card-longdesc">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.subtitle" />
                    </p>
                </div>
            </div>
        </div>
        <div class="card wew-kpi-card">
            <div class="card-header">
                <div class="card-header-body">
                    <div class="fs-1 fw-bold lh-1 mb-2 wew-kpi-value">{data.contentElementCount}</div>
                    <h3 class="card-title">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.contentElements" />
                    </h3>
                    <p class="card-longdesc">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.contentElements.hint" />
                    </p>
                </div>
            </div>
        </div>
        <div class="card wew-kpi-card">
            <div class="card-header">
                <div class="card-header-body">
                    <f:if condition="{data.lastChangedAt} > 0">
                        <f:then>
                            <div class="fs-4 fw-bold lh-sm mb-2"><f:format.date date="@{data.lastChangedAt}" pattern="dd. MMM y, HH:mm" /></div>
                            <f:if condition="{data.lastChangedByName}">
                                <div class="d-flex align-items-center gap-2 small text-muted mb-2">
                                    <f:if condition="{data.lastChangedByUid}">
                                        <be:avatar backendUser="{data.lastChangedByUid}" size="16" />
                                    </f:if>
                                    <span class="text-truncate">{data.lastChangedByName}</span>
                                </div>
                            </f:if>
                        </f:then>
                        <f:else>
                            <div class="fs-4 fw-bold lh-sm mb-2">-</div>
                        </f:else>
                    </f:if>
                    <h3 class="card-title">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.lastChanged" />
                    </h3>
                    <p class="card-longdesc">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.lastChanged.hint" />
                    </p>
                </div>
            </div>
        </div>
        <div class="card wew-kpi-card">
            <div class="card-header">
                <div class="card-header-body">
                    <div class="fs-1 fw-bold lh-1 mb-2 wew-kpi-value">{data.affectedTableCount}</div>
                    <h3 class="card-title">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.affectedTables" />
                    </h3>
                    <p class="card-longdesc">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.kpi.affectedTables.hint" />
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="card-header-body">
                <h3 class="card-title">
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.pending" />
                </h3>
            </div>
            <div class="btn-group" role="group" aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.relatedChanges.toggleAll')}">
                <button type="button" class="btn btn-default btn-sm" data-wew-related-open-all="">
                    <core:icon identifier="actions-chevron-expand" size="small" />
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.relatedChanges.showAll" />
                </button>
                <button type="button" class="btn btn-default btn-sm" data-wew-related-close-all="">
                    <core:icon identifier="actions-chevron-contract" size="small" />
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.relatedChanges.hideAll" />
                </button>
            </div>
        </div>

        <form method="post" action="{formAction}" data-wew-publish-form="" data-multi-record-selection-identifier="wew-pending-selection">
            <f:if condition="{data.changedCount} > 0">
                <f:then>
                    <div class="table-fit">
                        <table class="table table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th class="col-checkbox" scope="col">
                                        <div class="dropdown">
                                            <button type="button"
                                                    class="dropdown-toggle dropdown-toggle-link t3js-multi-record-selection-check-actions-toggle"
                                                    data-bs-toggle="dropdown"
                                                    data-bs-boundary="window"
                                                    aria-expanded="false"
                                                    aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.openSelectionOptions')}">
                                                <core:icon identifier="actions-selection" size="small" />
                                            </button>
                                            <ul class="dropdown-menu t3js-multi-record-selection-check-actions">
                                                <li>
                                                    <button type="button" class="dropdown-item" disabled="disabled" data-multi-record-selection-check-action="check-all">
                                                        <core:icon identifier="actions-selection-elements-all" size="small" />
                                                        <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.checkAll" />
                                                    </button>
                                                </li>
                                                <li>
                                                    <button type="button" class="dropdown-item" disabled="disabled" data-multi-record-selection-check-action="check-none">
                                                        <core:icon identifier="actions-selection-elements-none" size="small" />
                                                        <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.uncheckAll" />
                                                    </button>
                                                </li>
                                                <li>
                                                    <button type="button" class="dropdown-item" disabled="disabled" data-multi-record-selection-check-action="toggle">
                                                        <core:icon identifier="actions-selection-elements-invert" size="small" />
                                                        <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.toggleSelection" />
                                                    </button>
                                                </li>
                                            </ul>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.record" />
                                    </th>
                                    <th class="text-nowrap" scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.state" />
                                    </th>
                                    <th class="text-end text-nowrap" scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.actions" />
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{data.changedItemGroups}" as="group">
                                    <f:if condition="{group.items -> f:count()} > 0">
                                        <f:if condition="{group.label}">
                                            <tr class="table-secondary">
                                                <th colspan="4" scope="colgroup">{group.label}</th>
                                            </tr>
                                        </f:if>
                                        <f:for each="{group.items}" as="item">
                                            <f:render partial="Backend/Module/RecordRow" arguments="{item: item, config: config, selectable: 1}" />
                                        </f:for>
                                    </f:if>
                                </f:for>
                            </tbody>
                        </table>
                    </div>

                    <f:render partial="Backend/Module/PublishBar" arguments="{
                        changedCount: data.changedCount,
                        summaryLabelKey: 'module.approvalBar.summary',
                        unselectedLabelKey: 'module.approvalBar.unselected',
                        primaryAction: 'approve-publish',
                        primaryLabelKey: 'approval.publishSelected',
                        primaryIconIdentifier: 'actions-check-circle-alt',
                        secondaryAction: 'request-review',
                        secondaryLabelKey: 'review.requestSelected',
                        secondaryIconIdentifier: 'actions-share'
                    }" />
                </f:then>
                <f:else>
                    <f:render partial="Backend/Module/Placeholder" arguments="{
                        tone: 'empty',
                        iconIdentifier: 'actions-check-circle-alt',
                        title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.empty\')}',
                        hint: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.emptyHint\')}'
                    }" />
                </f:else>
            </f:if>
        </form>
    </div>
</section>

</html>

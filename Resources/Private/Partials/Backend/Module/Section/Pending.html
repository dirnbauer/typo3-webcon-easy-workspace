<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="wew-section" aria-labelledby="wew-section-pending-title">
    <h2 class="visually-hidden" id="wew-section-pending-title">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.pending" />
    </h2>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.pending" />
            </h3>
            <span class="badge badge-info">{data.changedCount}</span>
        </div>

        <form method="post" action="{formAction}" class="wew-section__form" data-wew-publish-form="">
            <input type="hidden" name="_action" value="publish" />

            <f:if condition="{data.changedCount} > 0">
                <f:then>
                    <div class="table-fit">
                        <table class="table table-striped table-hover wew-module-table">
                            <thead>
                                <tr>
                                    <th class="wew-module-table__check" scope="col"></th>
                                    <th scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.record" />
                                    </th>
                                    <th class="wew-module-table__state" scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.state" />
                                    </th>
                                    <th class="wew-module-table__actions" scope="col">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.actions" />
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{data.changedItemGroups}" as="group">
                                    <f:if condition="{group.items -> f:count()} > 0">
                                        <f:if condition="{group.label}">
                                            <tr class="table-secondary">
                                                <th colspan="4" scope="colgroup">{group.label}</th>
                                            </tr>
                                        </f:if>
                                        <f:for each="{group.items}" as="item">
                                            <f:render partial="Backend/Module/RecordRow" arguments="{item: item, config: config, selectable: 1}" />
                                        </f:for>
                                    </f:if>
                                </f:for>
                            </tbody>
                        </table>
                    </div>

                    <f:render partial="Backend/Module/PublishBar" arguments="{changedCount: data.changedCount}" />
                </f:then>
                <f:else>
                    <f:render partial="Backend/Module/Placeholder" arguments="{
                        tone: 'empty',
                        iconIdentifier: 'actions-check-circle-alt',
                        title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.empty\')}',
                        hint: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.emptyHint\')}'
                    }" />
                </f:else>
            </f:if>
        </form>
    </div>
</section>

</html>

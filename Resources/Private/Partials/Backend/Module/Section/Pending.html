<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="wew-section wew-section--list" aria-labelledby="wew-section-pending-title">
    <header class="wew-section__head">
        <div class="wew-section__heading">
            <p class="wew-section__eyebrow">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.title" />
            </p>
            <h2 class="wew-section__title" id="wew-section-pending-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.pending" />
            </h2>
            <p class="wew-section__subtitle">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.subtitle" />
            </p>
        </div>
        <div class="wew-section__head-meta">
            <span class="wew-state-pill wew-state-pill--info wew-state-pill--large">{data.changedCount}</span>
        </div>
    </header>

    <form method="post" action="{formAction}" class="wew-section__form" data-wew-publish-form="">
        <input type="hidden" name="_action" value="publish" />

        <f:if condition="{data.changedCount} > 0">
            <f:then>
                <ul class="wew-list wew-list--module" role="list">
                    <f:for each="{data.changedItemGroups}" as="group">
                        <f:if condition="{group.items -> f:count()} > 0">
                            <f:if condition="{group.label}">
                                <li class="wew-list__colheader" role="presentation">
                                    <span class="wew-list__colheader-label">{group.label}</span>
                                </li>
                            </f:if>
                            <f:for each="{group.items}" as="item">
                                <f:render partial="Backend/Module/RecordRow" arguments="{item: item, config: config, selectable: 1}" />
                            </f:for>
                        </f:if>
                    </f:for>
                </ul>

                <f:render partial="Backend/Module/PublishBar" arguments="{changedCount: data.changedCount}" />
            </f:then>
            <f:else>
                <f:render partial="Backend/Module/Placeholder" arguments="{
                    tone: 'empty',
                    iconIdentifier: 'actions-check-circle-alt',
                    title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.empty\')}',
                    hint: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.pending.emptyHint\')}'
                }" />
            </f:else>
        </f:if>
    </form>
</section>

</html>

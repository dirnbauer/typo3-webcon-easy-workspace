<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section class="wew-section" aria-labelledby="wew-section-all-title">
    <h2 class="visually-hidden" id="wew-section-all-title">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.all" />
    </h2>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.all" />
            </h3>
            <span class="badge badge-secondary">{data.totalCount}</span>
        </div>

        <f:if condition="{data.totalCount} > 0">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover wew-module-table">
                        <thead>
                            <tr>
                                <th class="wew-module-table__check" scope="col"></th>
                                <th scope="col">
                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.record" />
                                </th>
                                <th class="wew-module-table__state" scope="col">
                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.state" />
                                </th>
                                <th class="wew-module-table__actions" scope="col">
                                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.column.actions" />
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{data.itemGroups}" as="group">
                                <f:if condition="{group.items -> f:count()} > 0">
                                    <f:if condition="{group.label}">
                                        <tr class="table-secondary">
                                            <th colspan="4" scope="colgroup">{group.label}</th>
                                        </tr>
                                    </f:if>
                                    <f:for each="{group.items}" as="item">
                                        <f:render partial="Backend/Module/RecordRow" arguments="{item: item, config: config, selectable: 0}" />
                                    </f:for>
                                </f:if>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:render partial="Backend/Module/Placeholder" arguments="{
                    tone: 'empty',
                    iconIdentifier: 'actions-document-empty',
                    title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.all.empty\')}',
                    hint: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.all.emptyHint\')}'
                }" />
            </f:else>
        </f:if>
    </div>
</section>

</html>

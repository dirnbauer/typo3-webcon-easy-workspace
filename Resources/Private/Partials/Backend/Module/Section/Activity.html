<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="wew-section wew-section--activity" aria-labelledby="wew-section-activity-title">
    <header class="wew-section__head">
        <div class="wew-section__heading">
            <p class="wew-section__eyebrow">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.title" />
            </p>
            <h2 class="wew-section__title" id="wew-section-activity-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.activity" />
            </h2>
            <p class="wew-section__subtitle">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.activity.subtitle" />
            </p>
        </div>
        <div class="wew-section__head-actions">
            <a href="{sectionUrls.activity}" class="btn btn-default wew-section__refresh">
                <core:icon identifier="actions-refresh" size="small" />
                <span>
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.activity.refresh" />
                </span>
            </a>
        </div>
    </header>

    <div class="wew-activity">
        <f:if condition="{data.latestItems -> f:count()} > 0">
            <f:then>
                <ul class="wew-changelog wew-changelog--module" role="list">
                    <f:for each="{data.latestItems}" as="entry">
                        <f:render partial="Backend/Module/Activity/Entry" arguments="{entry: entry}" />
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <f:render partial="Backend/Module/Placeholder" arguments="{
                    tone: 'empty',
                    iconIdentifier: 'actions-check-circle-alt',
                    title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.empty\')}'
                }" />
            </f:else>
        </f:if>
    </div>
</section>

</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section aria-labelledby="wew-section-activity-title">
    <h2 class="visually-hidden" id="wew-section-activity-title">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.activity" />
    </h2>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.activity" />
            </h3>
            <a href="{moduleUrls.activity}" class="btn btn-default btn-sm">
                <core:icon identifier="actions-refresh" size="small" />
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.activity.refresh" />
            </a>
        </div>

        <f:if condition="{data.latestItems -> f:count()} > 0">
            <f:then>
                <ul class="list-group list-group-flush" role="list">
                    <f:for each="{data.latestItems}" as="entry">
                        <f:render partial="Backend/Module/Activity/Entry" arguments="{entry: entry}" />
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <f:render partial="Backend/Module/Placeholder" arguments="{
                    tone: 'empty',
                    iconIdentifier: 'actions-check-circle-alt',
                    title: '{f:translate(key: \'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:latest.empty\')}'
                }" />
            </f:else>
        </f:if>
    </div>
</section>

</html>

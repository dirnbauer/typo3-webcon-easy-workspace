<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section aria-labelledby="wew-section-dashboard-title">
    <h2 class="visually-hidden" id="wew-section-dashboard-title">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.dashboard" />
    </h2>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.section.dashboard" />
            </h3>
        </div>
        <div class="table-fit">
            <table class="table table-striped table-hover">
                <tbody>
                    <tr>
                        <th scope="row">
                            <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.statPending.label" />
                        </th>
                        <td><span class="badge badge-info">{data.changedCount}</span></td>
                    </tr>
                    <tr>
                        <th scope="row">
                            <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.statTotal.label" />
                        </th>
                        <td><span class="badge badge-secondary">{data.totalCount}</span></td>
                    </tr>
                    <tr>
                        <th scope="row">
                            <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.workspace" />
                        </th>
                        <td>{data.workspaceTitle}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div class="d-flex flex-wrap gap-2">
                <a href="{moduleUrls.pending}" class="btn btn-default">
                    <core:icon identifier="actions-document-save" size="small" />
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.cta.review" />
                </a>
                <a href="{moduleUrls.all}" class="btn btn-default">
                    <core:icon identifier="actions-list" size="small" />
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.cta.allRecords" />
                </a>
                <a href="{moduleUrls.activity}" class="btn btn-default">
                    <core:icon identifier="actions-clock" size="small" />
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.dashboard.cta.activity" />
                </a>
            </div>
        </div>
    </div>
</section>

</html>

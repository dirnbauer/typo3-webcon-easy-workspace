<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:variable name="childTitle" value="{child.title}" />
<f:if condition="{childTitle} == ''"><f:variable name="childTitle" value="{child.tableLabel}" /></f:if>
<f:if condition="{childTitle} == ''"><f:variable name="childTitle" value="{child.table}" /></f:if>

<f:variable name="childTableLabel" value="{child.tableLabel}" />
<f:if condition="{childTableLabel} == ''"><f:variable name="childTableLabel" value="{child.table}" /></f:if>

<f:variable name="childBadgeTone" value="{child.badge}" />
<f:if condition="{childBadgeTone} == ''"><f:variable name="childBadgeTone" value="info" /></f:if>

<li class="list-group-item d-flex align-items-start gap-2">
    <f:if condition="{child.thumbnailUrl}">
        <span>
            <img class="img-thumbnail" src="{child.thumbnailUrl}" width="36" height="28" alt="" loading="lazy" />
        </span>
    </f:if>
    <span class="min-w-0 flex-grow-1">
        <span class="d-block text-truncate fw-semibold" title="{child.title}">{childTitle}</span>
        <span class="d-block text-muted small">
            {childTableLabel}<f:if condition="{child.typeLabel}"> · {child.typeLabel}</f:if>
        </span>
    </span>
    <span class="badge badge-{childBadgeTone} flex-shrink-0">{child.kindLabel}</span>
</li>

</html>

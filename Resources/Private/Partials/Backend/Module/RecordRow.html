<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:variable name="primaryKicker" value="" />
<f:if condition="{item.isPrimary}">
    <f:if condition="{item.table} == 'pages'">
        <f:variable name="primaryKicker" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:record.pageRecord')}" />
    </f:if>
    <f:if condition="{item.table} == 'tx_news_domain_model_news'">
        <f:variable name="primaryKicker" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:record.newsRecord')}" />
    </f:if>
</f:if>
<f:variable name="showStatePills" value="1" />
<f:if condition="{config.showSubelementsInModule} == 0">
    <f:variable name="showStatePills" value="0" />
</f:if>

<tr class="wew-record-row{f:if(condition: item.isChanged, then: ' wew-record-row--changed', else: ' wew-record-row--live')}"
    data-multi-record-selection-element=""
    data-multi-record-selection-identifier="wew-pending-selection">
    <td class="col-checkbox">
        <f:if condition="{item.isChanged} && {selectable}">
            <span class="form-check form-check-type-toggle">
                <input type="checkbox"
                       name="selections[]"
                       value="{item.table}:{item.workspaceUid}"
                       id="wew-{item.table}-{item.workspaceUid}"
                       class="form-check-input t3js-multi-record-selection-check"
                       data-wew-row-check=""
                       checked="checked" />
            </span>
        </f:if>
    </td>
    <td>
        <div class="wew-record-cell">
            <f:if condition="{config.enableThumbnails} && {item.thumbnailUrl}">
                <f:then>
                    <img class="img-thumbnail" src="{item.thumbnailUrl}" width="48" height="36" alt="" loading="lazy" />
                </f:then>
                <f:else>
                    <span class="wew-record-icon" aria-hidden="true">
                        <core:icon identifier="{item.iconIdentifier}" size="small" />
                    </span>
                </f:else>
            </f:if>
            <div class="min-w-0">
                <f:if condition="{primaryKicker}">
                    <span class="d-block text-muted small">{primaryKicker}</span>
                </f:if>
                <f:if condition="{item.isChanged} && {selectable}">
                    <f:then>
                        <label class="fw-semibold text-truncate d-block mb-0" for="wew-{item.table}-{item.workspaceUid}" title="{item.title}">
                            {item.title}
                        </label>
                    </f:then>
                    <f:else>
                        <span class="fw-semibold text-truncate d-block" title="{item.title}">{item.title}</span>
                    </f:else>
                </f:if>
                <f:if condition="{config.enableTypeLabels}">
                    <span class="d-block text-muted small">
                        {item.tableLabel}<f:if condition="{item.typeLabel} && '{item.typeLabel}' != '{item.tableLabel}'"> · {item.typeLabel}</f:if>
                    </span>
                </f:if>
                <f:if condition="{config.showSubelementsInModule} && {item.childChanges -> f:count()} > 0">
                    <f:variable name="childCount" value="{item.childChanges -> f:count()}" />
                    <details class="wew-related-thread" data-wew-related-changes="">
                        <summary class="small fw-semibold">
                            <span class="badge badge-secondary">{childCount}</span>
                            <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.relatedRecords"
                                         arguments="{count: childCount}" />
                        </summary>
                        <ul class="list-group wew-related-thread__list">
                            <li class="list-group-item wew-related-thread__parent">
                                <span class="wew-record-icon wew-record-icon--small" aria-hidden="true">
                                    <core:icon identifier="{item.iconIdentifier}" size="small" />
                                </span>
                                <span class="min-w-0">
                                    <span class="d-block text-muted small">
                                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:module.relatedChanges.belongsTo" />
                                    </span>
                                    <span class="d-block fw-semibold text-truncate" title="{item.title}">{item.title}</span>
                                </span>
                            </li>
                            <f:for each="{item.childChanges}" as="child">
                                <f:render partial="Backend/Module/ChildChange" arguments="{child: child}" />
                            </f:for>
                        </ul>
                    </details>
                </f:if>
            </div>
        </div>
    </td>
    <td class="text-nowrap">
        <div class="d-flex flex-wrap gap-1">
            <f:if condition="{showStatePills}">
                <f:for each="{item.changeBadges}" as="badge">
                    <span class="badge badge-{badge.badge}">{badge.kindLabel}</span>
                </f:for>
                <f:if condition="{item.isChanged} == 0">
                    <span class="badge badge-secondary">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:state.live" />
                    </span>
                </f:if>
                <f:if condition="{item.isHidden} && {config.enableHiddenBadge}">
                    <span class="badge badge-secondary"
                          title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.hidden.title')}">
                        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.hidden" />
                    </span>
                </f:if>
            </f:if>
        </div>
    </td>
    <td class="text-end text-nowrap">
        <div class="btn-group" role="group">
            <f:if condition="{item.historyUrl}">
                <button type="button"
                        class="btn btn-default btn-sm"
                        data-wew-diff=""
                        data-wew-history-url="{item.historyUrl}"
                        data-wew-table="{item.table}"
                        data-wew-workspace-uid="{item.workspaceUid}"
                        data-wew-title="{item.title}"
                        title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.viewHistory')}">
                    <core:icon identifier="actions-document-history-open" size="small" />
                </button>
            </f:if>

            <f:if condition="{item.isChanged}">
                <f:if condition="{config.enableRevert}">
                    <f:then>
                        <button type="button"
                                class="btn btn-default btn-sm"
                                data-wew-discard=""
                                data-wew-table="{item.table}"
                                data-wew-workspace-uid="{item.workspaceUid}"
                                data-wew-title="{item.title}"
                                data-wew-kind-key="{item.kindKey}"
                                title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.title')}"
                                aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.aria')}">
                            <core:icon identifier="actions-undo" size="small" />
                        </button>
                    </f:then>
                    <f:else>
                        <button type="button"
                                class="btn btn-default btn-sm"
                                disabled="disabled"
                                title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.disabledTitle')}"
                                aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.disabledAria')}">
                            <core:icon identifier="actions-undo" size="small" />
                        </button>
                    </f:else>
                </f:if>
            </f:if>

            <f:if condition="{item.contextualEditUrl} || {item.editUrl}">
                <button type="button"
                        class="btn btn-default btn-sm"
                        data-wew-edit=""
                        data-wew-edit-url="{item.contextualEditUrl ?: item.editUrl}"
                        data-wew-contextual="{f:if(condition: item.contextualEditUrl, then: '1', else: '0')}"
                        data-wew-title="{item.title}"
                        title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:edit.modalTitle', arguments: '{title: item.title}')}"
                        aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:edit.modalTitle', arguments: '{title: item.title}')}">
                    <core:icon identifier="actions-open" size="small" />
                </button>
            </f:if>
        </div>
    </td>
</tr>

</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:variable name="hasItems" value="0" />
<f:for each="{groups}" as="group">
    <f:if condition="{group.items -> f:count()} > 0">
        <f:variable name="hasItems" value="1" />
    </f:if>
</f:for>

<f:if condition="{hasItems} == 0">
    <f:then>
        <div class="wew-menu__empty" data-wew-list-empty="">
            <span class="wew-menu__empty-icon" aria-hidden="true">✓</span>
            <p><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:{emptyMessageKey}" /></p>
        </div>
    </f:then>
    <f:else>
        <ul class="wew-list" data-wew-list="">
            <f:for each="{groups}" as="group">
                <f:if condition="{group.label}">
                    <li class="wew-list__colheader" role="presentation">
                        <span class="wew-list__colheader-label">{group.label}</span>
                    </li>
                </f:if>
                <f:for each="{group.items}" as="item">
                    <f:render partial="Toolbar/ListItem" arguments="{item: item, config: config, showSubelements: showSubelements}" />
                </f:for>
            </f:for>
        </ul>
    </f:else>
</f:if>

</html>

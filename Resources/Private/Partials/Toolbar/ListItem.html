<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:variable name="rowId" value="wew-{item.table}-{item.workspaceUid}" />
<f:variable name="rowClasses" value="wew-list__row" />
<f:if condition="{item.isPrimary}"><f:variable name="rowClasses" value="{rowClasses} wew-list__row--primary" /></f:if>
<f:if condition="{item.isChanged}"><f:then><f:variable name="rowClasses" value="{rowClasses} wew-list__row--changed" /></f:then><f:else><f:variable name="rowClasses" value="{rowClasses} wew-list__row--unchanged" /></f:else></f:if>
<f:if condition="{item.isHidden}"><f:variable name="rowClasses" value="{rowClasses} wew-list__row--hidden" /></f:if>

<f:variable name="locateTable" value="{item.locateTable}" />
<f:if condition="{locateTable} == ''"><f:variable name="locateTable" value="{item.table}" /></f:if>
<f:variable name="locateLiveUid" value="{item.locateLiveUid}" />
<f:if condition="{locateLiveUid} == 0"><f:variable name="locateLiveUid" value="{item.liveUid}" /></f:if>
<f:variable name="locateWorkspaceUid" value="{item.locateWorkspaceUid}" />
<f:if condition="{locateWorkspaceUid} == 0"><f:variable name="locateWorkspaceUid" value="{item.workspaceUid}" /></f:if>

<f:variable name="isLocatable" value="0" />
<f:if condition="{config.enableHoverHighlight} && {locateTable} == 'tt_content' && ({locateLiveUid} > 0 || {locateWorkspaceUid} > 0)">
    <f:variable name="isLocatable" value="1" />
</f:if>
<f:variable name="isEditable" value="0" />
<f:if condition="{item.contextualEditUrl} || {item.editUrl}">
    <f:variable name="isEditable" value="1" />
</f:if>
<f:variable name="canRevert" value="0" />
<f:if condition="{config.enableRevert} && {item.isChanged}">
    <f:variable name="canRevert" value="1" />
</f:if>
<f:variable name="editUrl" value="{item.editUrl}" />
<f:if condition="{item.contextualEditUrl}">
    <f:variable name="editUrl" value="{item.contextualEditUrl}" />
</f:if>

<li class="{rowClasses}"
    data-table="{item.table}"
    data-wew-key="{item.table}:{item.workspaceUid}">
    <label class="wew-list__label" for="{f:if(condition: item.isChanged, then: rowId, else: '')}">
        <f:if condition="{item.isChanged}">
            <input type="checkbox"
                   id="{rowId}"
                   class="form-check-input wew-list__check visually-hidden"
                   checked="checked"
                   data-wew-row-check="" />
            <span class="wew-list__mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M3 8.5l3 3 7-7"/>
                </svg>
            </span>
        </f:if>

        <f:if condition="{item.thumbnailUrl}">
            <span class="wew-list__thumb">
                <img src="{item.thumbnailUrl}" alt="" loading="lazy" />
            </span>
        </f:if>

        <span class="wew-list__body">
            <f:if condition="{item.isPrimary} && {item.table} == 'pages'">
                <span class="wew-list__primary-kicker"><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:record.pageRecord" /></span>
            </f:if>
            <f:if condition="{item.isPrimary} && {item.table} == 'tx_news_domain_model_news'">
                <span class="wew-list__primary-kicker"><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:record.newsRecord" /></span>
            </f:if>

            <span class="wew-list__head">
                <span class="wew-list__title-text" title="{item.title}">{item.title}</span>
            </span>

            <f:if condition="{config.enableTypeLabels}">
                <span class="wew-list__sub">
                    <span class="wew-list__table">
                        {item.tableLabel}
                        <f:if condition="{item.typeLabel} && '{item.typeLabel}' != '{item.tableLabel}'">
                            <span class="wew-list__sep">·</span> {item.typeLabel}
                        </f:if>
                    </span>
                </span>
            </f:if>

            <f:if condition="{item.isChanged}">
                <span class="wew-list__change-actions">
                    <f:if condition="{item.historyUrl}">
                        <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.history')}" />
                        <f:if condition="{item.kindKey} == 'new' && {item.historyDiffCount} > 0">
                            <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.newWithChanges')}" />
                        </f:if>
                        <f:if condition="{item.kindKey} == 'new' && {item.historyDiffCount} == 0">
                            <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.newDetails')}" />
                        </f:if>
                        <f:if condition="{item.kindKey} == 'delete'">
                            <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.removal')}" />
                        </f:if>
                        <f:if condition="{item.kindKey} == 'move'">
                            <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.move')}" />
                        </f:if>
                        <f:if condition="{item.kindKey} == 'modified'">
                            <f:variable name="diffTitle" value="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.title.changed')}" />
                        </f:if>
                        <button type="button"
                                class="wew-list__diff-trigger"
                                title="{diffTitle}"
                                data-wew-diff=""
                                data-wew-table="{item.table}"
                                data-wew-workspace-uid="{item.workspaceUid}">
                            <span class="wew-list__diff-trigger-icon" aria-hidden="true">⇄</span>
                            <span class="wew-list__diff-trigger-label"><f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:diff.viewHistory" /></span>
                        </button>
                    </f:if>

                    <f:if condition="{showSubelements}">
                        <span class="wew-list__badges">
                            <f:for each="{item.changeBadges}" as="badge">
                                <span class="wew-state-pill wew-state-pill--{badge.badge} wew-state-pill--inline">{badge.kindLabel}</span>
                            </f:for>
                        </span>
                        <f:if condition="{item.isHidden} && {config.enableHiddenBadge}">
                            <span class="wew-state-pill wew-state-pill--secondary wew-state-pill--inline"
                                  title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.hidden.title')}">
                                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.hidden" />
                            </span>
                        </f:if>
                    </f:if>
                </span>
            </f:if>

            <f:if condition="{showSubelements} && {item.childChanges -> f:count()} > 0">
                <span class="wew-list__children">
                    <f:for each="{item.childChanges}" as="child">
                        <f:render partial="Toolbar/ChildChange" arguments="{child: child}" />
                    </f:for>
                </span>
            </f:if>
        </span>

        <f:if condition="{item.isChanged} || {isLocatable} || {isEditable}">
            <span class="wew-list__actions">
                <f:if condition="{item.isChanged}">
                    <button type="button"
                            class="wew-list__discard{f:if(condition: canRevert, else: ' wew-list__discard--disabled')}"
                            title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.title')}"
                            aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:discard.button.aria')}"
                            data-wew-discard=""
                            data-wew-table="{item.table}"
                            data-wew-workspace-uid="{item.workspaceUid}"
                            data-wew-kind-key="{item.kindKey}"
                            data-wew-can-revert="{canRevert}"
                            disabled="{f:if(condition: canRevert, else: 'disabled')}">
                        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                            <path fill="currentColor" d="M8 2c-1.8 0-3.4.8-4.5 2l-1-1c-.2-.2-.4-.1-.4.1l-.9 3.8c0 .2.1.3.3.3l3.8-.9c.2 0 .3-.3.1-.4l-1-1c.9-1 2.2-1.7 3.7-1.7 2.7 0 4.9 2.2 4.9 4.9S10.8 13 8.1 13c-1.5 0-2.8-.7-3.7-1.7l-.9.7c1.1 1.2 2.7 2 4.5 2 3.3 0 6-2.7 6-6s-2.7-6-6-6z"/>
                        </svg>
                    </button>
                </f:if>
                <f:if condition="{isLocatable} || {isEditable}">
                    <button type="button"
                            class="wew-list__locate{f:if(condition: isLocatable, else: ' wew-list__locate--edit-only')}"
                            title="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:edit.modalTitle', arguments: '{title: item.title}')}"
                            aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:edit.modalTitle', arguments: '{title: item.title}')}"
                            data-wew-edit=""
                            data-wew-locate="{f:if(condition: isLocatable, then: '1', else: '0')}"
                            data-wew-edit-url="{editUrl}">
                        <svg class="wew-list__locate-icon wew-list__locate-icon--eye" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                            <path fill="currentColor" d="M8.07 3C4.112 3 1 5.286 1 8s2.97 5 7 5c3.889 0 7-2.286 7-4.93C15 5.285 11.889 3.142 8.212 3h-.141Zm-.025 1.127c.141 0 .423.141.423.282s-.14.282-.423.282c-.845 0-1.69.704-1.69 1.55 0 .14-.141.282-.423.282-.282 0-.423-.141-.423-.282.141-1.127 1.268-2.114 2.536-2.114ZM2 8.03c0-1.298 1.017-2.591 2.647-3.312-.296.432-.296 1.01-.296 1.587 0 2.02 1.63 3.606 3.703 3.606 2.074 0 3.704-1.587 3.704-3.606 0-.577-.148-1.01-.296-1.443C12.943 5.582 14 6.875 14 8.029c-.148 2.02-2.841 3.924-6 3.971-3.36-.047-6-1.95-6-3.97Z"/>
                        </svg>
                        <svg class="wew-list__locate-icon wew-list__locate-icon--pencil" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                            <path fill="currentColor" d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10ZM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5ZM12.793 5.5 10.5 3.207 3 10.707V11h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293L12.793 5.5Zm-9.761 5.175-.215.541.659.659.541-.215-.215-.215a.5.5 0 0 1-.137-.275.5.5 0 0 1-.275-.137l-.358-.358Z"/>
                        </svg>
                    </button>
                </f:if>
            </span>
        </f:if>
    </label>
</li>

</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{newsUid} > 0">
    <div class="wew-menu__context" role="note">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:context.news" arguments="{uid: newsUid}" />
    </div>
</f:if>
<f:if condition="{newsUid} == 0 && {pageUid} > 0">
    <div class="wew-menu__context" role="note">
        <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:context.page" arguments="{uid: pageUid}" />
    </div>
</f:if>

</html>

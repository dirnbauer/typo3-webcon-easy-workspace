<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<footer class="wew-menu__foot" data-wew-footer="">
    <div class="wew-menu__foot-selection">
        <f:if condition="{changedCount} > 0">
            <label class="wew-menu__selectall">
                <input type="checkbox"
                       class="wew-menu__selectall-check"
                       checked="checked"
                       aria-checked="true"
                       aria-label="{f:translate(key: 'LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.deselectAllChanges')}"
                       data-wew-select-all="" />
                <span class="wew-menu__selectall-label" data-wew-select-all-label="">
                    <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.allSelected" />
                </span>
            </label>
            <span class="wew-menu__count" aria-live="polite" data-wew-selection-count="">
                <strong data-wew-selected-count="">{changedCount}</strong>
                <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.of" />
                <span data-wew-total-count="">{changedCount}</span>
            </span>
        </f:if>
    </div>
    <div class="wew-menu__foot-action">
        <button type="button"
                class="btn btn-primary wew-menu__publish"
                data-wew-publish=""
                {f:if(condition: '{changedCount} == 0', then: 'disabled="disabled"')}>
            <f:translate key="LLL:EXT:webcon_easy_workspace/Resources/Private/Language/locallang.xlf:toolbar.publishToLive" />
            <f:if condition="{changedCount} > 0"> ({changedCount})</f:if>
        </button>
    </div>
</footer>

</html>

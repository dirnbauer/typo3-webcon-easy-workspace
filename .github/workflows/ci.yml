name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: functional
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, pdo_mysql, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: PHP lint
        run: composer lint

      - name: Coding guidelines (dry run)
        run: composer cgl

      - name: PHPStan (level 8)
        run: composer phpstan

      - name: Unit tests
        run: composer test:unit

      - name: Functional tests (MariaDB 10.11)
        env:
          typo3DatabaseDriver: mysqli
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseName: functional
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
        run: composer test:functional

  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

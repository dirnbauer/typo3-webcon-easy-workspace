name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: PHP lint
        run: composer lint

      - name: PHPStan
        run: composer phpstan

      - name: Unit tests
        run: composer test:unit

      - name: Functional tests (sqlite)
        run: composer test:functional
